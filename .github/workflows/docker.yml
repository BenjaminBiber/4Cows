name: Build & Push Image to Docker Hub

# Nur von Hand. workflow_dispatch blendet in der Actions-Oberflaeche bereits
# eine Auswahl "Use workflow from" ein, und actions/checkout holt genau diesen
# Branch - ein eigener branch-Input waere eine zweite Quelle, die der ersten
# widersprechen kann.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: benjaminbiber/4cows:latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # build-push-action statt "docker build": nur damit laesst sich der
      # Layer-Cache zwischen Laeufen halten. Ohne ihn laedt jeder Lauf die
      # wasm-tools-Workload neu - mehrere hundert MB fuer einen Build, in dem
      # sich vielleicht eine .razor-Datei geaendert hat.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: benjaminbiber/4cows:latest
          # Haelt den Tag auf Docker Hub ein einfaches Image statt eines
          # OCI-Index. Aeltere Docker-Daemons stolpern ueber das
          # Attestation-Manifest, und hier wertet es ohnehin niemand aus.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
